# Model parameters are kept here. API keys stay in .env.

[profiles.kimi]
base_url = "https://api.moonshot.cn/v1"
model = "kimi-k2.6"
api_key_env = "KIMI_API_KEY"
temperature = 0.6
extra_body_json = '{"thinking":{"type":"disabled"}}'

[profiles.qwen]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3.7-plus"
api_key_env = "QWEN_API_KEY"
temperature = 0.6

[profiles.glm]
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-4.5-air"
api_key_env = "GLM_API_KEY"
temperature = 0.6
extra_body_json = '{"thinking":{"type":"disabled"}}'

[profiles.glm47]
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-4.7"
api_key_env = "GLM_API_KEY"
temperature = 1.0
extra_body_json = '{"thinking":{"type":"disabled"}}'
request_timeout_s = 600
max_retries = 0
max_tokens = 8192
inter_task_delay_s = 30

[profiles.glm52]
base_url = "http://models.ascend.huawei.com/v1"
model = "glm-5.2"
api_key_env = "GLM_API_KEY"
temperature = 1.0
extra_body_json = '{"chat_template_kwargs":{"enable_thinking":false}}'
request_timeout_s = 600
max_retries = 0
max_tokens = 8192
inter_task_delay_s = 30

[profiles.custom]
base_url = "https://your-openai-compatible-endpoint/v1"
model = "your-judge-model"
api_key_env = "CUSTOM_JUDGE_API_KEY"
temperature = 0.0
