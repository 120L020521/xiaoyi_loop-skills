  const judgeText = (task) => { const score = typeof task.judge_score === 'number' ? ` · ${task.judge_score.toFixed(2)}` : ''; const kind = judgeKind(task); return kind === 'passed' ? `通过${score}` : kind === 'failed' ? `未通过${score}` : kind === 'missing' ? '缺失' : '异常'; };
  const badge = (text, style = '') => { const n = el('span','badge',text); if (style) n.setAttribute('style',style); return n; };
  const metaRow = (label, valueNode) => { const row = el('div','meta-row'); row.append(el('span','meta-label',label), valueNode instanceof Node ? valueNode : el('span','meta-value',safe(valueNode))); return row; };
  const addOption = (root, value, label) => { const o = el('option','',label); o.value = value; root.append(o); };

  function mergeChanges(changes) {
    const merged = new Map();
    (changes || []).forEach((change) => {
      const key = JSON.stringify([change.priority,change.component,change.target,change.title,change.problem,change.implementation,change.acceptance_criteria,change.expected_impact]);
      if (!merged.has(key)) merged.set(key,{...change,error_refs:[]});
      const item = merged.get(key); item.error_refs = [...new Set([...item.error_refs,...(change.error_refs || [])])];
    });
    return [...merged.values()].sort((a,b)=>(rank[a.priority]??9)-(rank[b.priority]??9));
  }

  function parseRawLogExcerpt(rawValue) {
    const rawText = typeof rawValue === 'string' ? rawValue.trim() : JSON.stringify(rawValue);
    if (!rawText) return {events:[],wrapped:false};
    try {
      let parsed = JSON.parse(rawText);
      if (typeof parsed === 'string') { try { parsed = JSON.parse(parsed); } catch (_ignored) {} }
      return {events:Array.isArray(parsed) ? parsed : [parsed],wrapped:false};
    } catch (_ignored) {}
    const lines = rawText.split(/\r?\n/).filter((line)=>line.trim()!=='');
    if (lines.length > 1) {
      try { return {events:lines.map((line)=>JSON.parse(line)),wrapped:false}; } catch (_ignored) {}
    }
    const readable=rawText.replace(/\\r\\n/g,'\n').replace(/\\n/g,'\n').replace(/\\t/g,'\t');
    return {events:[{raw_log_excerpt:readable}],wrapped:true};
  }

  function formatRawLogExcerptAsJson(rawValue) {
    const parsed = parseRawLogExcerpt(rawValue);
    if (parsed.events.length === 1) return JSON.stringify(parsed.events[0],null,2);
    if (parsed.events.length > 1) return JSON.stringify(parsed.events,null,2);
    return '';
  }

  function renderEvidence(items) {
    const list = el('ul','ev-list');
    (items || []).forEach((item,index) => {
      const card = el('li','ev-card');
      const head = el('div','ev-head');
      const source = safe(item.source,'TRACE');
      head.append(badge(source,'color:#0f766e;background:#f0fdfa;border:1px solid #99f6e4'));
      if (item._error_id) head.append(badge(`关联 ${item._error_id}`,'color:#b91c1c;background:#fef2f2;border:1px solid #fecaca'));
      if (source === 'TRACE') {
        head.append(el('code','',`span_index=${Number.isInteger(item.span_index)?item.span_index:'—'}`));
        head.append(el('code','',`span_id=${safe(item.reference)}`));
        head.append(el('code','',`tool=${safe(item.tool)}`));
      } else head.append(el('code','',`ref=${safe(item.reference)}`));
      card.append(head,el('div','fact',safe(item.fact,'')));
      if (source === 'TRACE' && item.raw_log_excerpt) {
        const parsed = parseRawLogExcerpt(item.raw_log_excerpt);
        const details = el('details','excerpt');
        details.append(el('summary','',`日志原文 · JSON（${String(item.raw_log_excerpt).length} 字符${parsed.wrapped?'，原文已封装':''}）`));
        const events = el('div','events');
        if (parsed.events.length) parsed.events.forEach((event,eventIndex)=>{
          events.append(el('div','event-tag',`事件 ${eventIndex+1}${event && event.type ? ` · ${event.type}` : ''}${event && event.name ? ` · ${event.name}` : ''}`));
          const pre = el('pre','json'); pre.textContent = JSON.stringify(event,null,2); events.append(pre);
        });
        details.append(events); card.append(details);
      }
      list.append(card);
    });
    return list;
  }

  function buildBundles(task) {
    const findings=[...(task.error_findings || [])].sort((a,b)=>(rank[a.priority]??9)-(rank[b.priority]??9));
    const findingMap=new Map(findings.map((finding)=>[finding.error_id,finding]));
    const referenced=new Set();
    const bundles=mergeChanges(task.proposed_changes || []).map((change)=>{
      const linked=(change.error_refs || []).map((ref)=>findingMap.get(ref)).filter(Boolean);
      linked.forEach((finding)=>referenced.add(finding.error_id));
      return {change,findings:linked,priority:change.priority || linked[0]?.priority || 'P4'};
    });
    findings.filter((finding)=>!referenced.has(finding.error_id)).forEach((finding)=>bundles.push({change:null,findings:[finding],priority:finding.priority || 'P4'}));
    return bundles.sort((a,b)=>(rank[a.priority]??9)-(rank[b.priority]??9));
  }

  function renderProblem(item) {
    const box=el('div','problem-card'); const head=el('div','problem-head'); const priority=item.priority || 'P4';
    head.append(el('span','err-id',safe(item.error_id,'ERR')),badge(priority,priorityStyle[priority] || priorityStyle.P4),badge(categoryLabels[item.category] || safe(item.category,'未分类'),'color:#334155;background:#f1f5f9;border:1px solid #cbd5e1'),badge(recoveryLabels[item.recovery_status] || safe(item.recovery_status,'未知'),item.recovery_status==='RECOVERED'?'color:#047857;background:#ecfdf5;border:1px solid #a7f3d0':'color:#b91c1c;background:#fef2f2;border:1px solid #fecaca'),el('span','problem-title',safe(item.title,'未命名问题')));
    box.append(head);
    const summary=el('div','err-block'); summary.append(el('div','block-label',`概述（发生 ${item.occurrence_count || 1} 次）`),el('div','',safe(item.summary,'')));
    const cause=el('div','err-block'); cause.append(el('div','block-label','根因'),el('div','',safe(item.root_cause,'')));
    const impact=el('div','err-block'); impact.append(el('div','block-label','影响'),el('div','',safe(item.impact,'')));
    box.append(summary,cause,impact); return box;
  }

  function collectEvidence(findings) {
    const seen=new Set(), evidence=[];
    findings.forEach((finding)=>(finding.evidence || []).forEach((item)=>{
      const key=JSON.stringify([item.source,item.reference,item.span_index,item.tool,item.fact,item.raw_log_excerpt]);
      if(!seen.has(key)){seen.add(key);evidence.push({...item,_error_id:finding.error_id});}
    }));
    return evidence;
  }

  function renderImprovement(task,bundle,index) {
    const change=bundle.change, priority=bundle.priority || 'P4', refs=bundle.findings.map((finding)=>finding.error_id);
    const article=el('article',`card improvement-card ${priority.toLowerCase()}`); article.id=`improvement-${domToken(taskIdentity(task))}-${index}`;
    article.dataset.priority=priority; article.dataset.component=change?.component || ''; article.dataset.categories=bundle.findings.map((finding)=>finding.category || '').join('|'); article.dataset.recoveries=bundle.findings.map((finding)=>finding.recovery_status || 'UNKNOWN').join('|');
    const head=el('button','card-head'); head.type='button'; head.setAttribute('aria-expanded','true');
    head.append(el('span','chev','▸'),el('span','chg-tag',`改进项 ${index+1}`),badge(priority,priorityStyle[priority] || priorityStyle.P4));
    if(change?.component) head.append(badge(componentLabels[change.component] || change.component,'color:#6d28d9;background:#f5f3ff;border:1px solid #ddd6fe'));
    head.append(el('span','card-title',safe(change?.title,bundle.findings[0]?.title || '未命名改进项')),el('span','chg-refs',`关联：${refs.join(', ') || '—'}`));
    const body=el('div','card-body');
    const problems=el('section','flow-section problem-section'); problems.append(el('span','flow-title',`关联错误（${bundle.findings.length}）`)); const problemList=el('div','problem-list');
    bundle.findings.forEach((finding)=>problemList.append(renderProblem(finding))); if(!bundle.findings.length) problemList.append(el('div','no-suggestion','未找到该建议引用的错误。')); problems.append(problemList); body.append(problems);
    const solution=el('section','flow-section solution-section'); solution.append(el('span','flow-title','修改建议')); const solutionBody=el('div','solution-body');
    if(change){[['建议说明',change.problem],['目标文件',change.target],['实施方案',change.implementation]].forEach(([label,value])=>{const block=el('div','err-block');block.append(el('div','block-label',label),el('div','',safe(value,'')));solutionBody.append(block);});if((change.acceptance_criteria || []).length){const block=el('div','err-block');block.append(el('div','block-label','验收标准'));const ul=el('ul');change.acceptance_criteria.forEach((criterion)=>ul.append(el('li','',criterion)));block.append(ul);solutionBody.append(block);}const expected=el('div','err-block');expected.append(el('div','block-label','预期影响'),el('div','',safe(change.expected_impact,'')));solutionBody.append(expected);}
    else solutionBody.append(el('div','no-suggestion','该错误尚未关联修改建议。'));
    solution.append(solutionBody); body.append(solution);
    const evidence=collectEvidence(bundle.findings); const details=el('details','evidence-chain'); details.append(el('summary','',`证据链（${evidence.length} 条，点击展开）`)); if(evidence.length) details.append(renderEvidence(evidence)); else details.append(el('div','no-suggestion','没有可展示的证据。')); body.append(details);
    article.append(head,body); return article;
  }

  function renderTask(task) {
    const section = el('section','task'); section.id=taskDomId(task); section.dataset.task=taskIdentity(task); section.dataset.judge=judgeKind(task); section.dataset.classification=task.execution_classification || '';
    const heading=el('h2'); heading.append(el('span','tick',taskDisplay(task)),el('span','task-name',safe(task.task_id))); section.append(heading);
    const taskValue=el('span','meta-value'); taskValue.append(el('code','',safe(task.task,''))); section.append(metaRow('任务',taskValue));
    const traceIds=el('span','meta-value'); traceIds.append(el('code','',(task.trace_ids || []).join(', ') || safe(task.trace_fingerprint))); section.append(metaRow('trace_ids',traceIds));
    if ((task.expected_output_files || []).length) { const outputs=el('span','meta-value filelist'); task.expected_output_files.forEach((file)=>outputs.append(el('span','fl',safe(file)))); section.append(metaRow('期望输出文件',outputs)); }
    section.append(metaRow('执行状态',`${safe(task.runner_status,'未知')} · ${classificationLabels[task.execution_classification] || safe(task.execution_classification,'未知')}`));
    section.append(metaRow('评测结果',task.judge_summary || `Judge ${judgeText(task)}`));
    const files=el('span','meta-value filelist');
    [['HALO JSON',task.report_uri],['Judge JSON',task.judge_result_uri],['Trace JSONL',task.trace_uri]].forEach(([label,href])=>{ if (href) { const a=el('a','fl',label); a.href=href; a.target='_blank'; a.rel='noreferrer'; files.append(a); } });
    if (files.childNodes.length) section.append(metaRow('相关文件',files));
    const mode=el('div','err-block'); mode.append(el('div','block-label','主导失败模式'),el('div','',safe(task.primary_failure_mode || task.halo_message,'无可用诊断结论'))); section.append(mode);
    const bundles=buildBundles(task); const heading3=el('h3','',`改进项 `); heading3.append(el('span','count',String(bundles.length))); section.append(heading3);
    bundles.forEach((bundle,index)=>section.append(renderImprovement(task,bundle,index)));
    return section;
  }

  function renderToc(task,taskIndex) {
    const li=el('li'); const taskLink=el('a','task-link',`${taskDisplay(task)} ${safe(task.task_id)}`); taskLink.href=`#${taskDomId(task)}`; taskLink.dataset.spy=''; li.append(taskLink);
    const nested=el('ul');
    buildBundles(task).forEach((bundle,index)=>{ const row=el('li'); const a=el('a','',`改进项 ${index+1} · ${safe(bundle.change?.title,bundle.findings[0]?.title || '未命名')}`); a.href=`#improvement-${domToken(taskIdentity(task))}-${index}`; a.title=safe(bundle.change?.title,bundle.findings[0]?.title || ''); a.dataset.spy=''; row.append(a); nested.append(row); });
    li.append(nested); return li;
  }

  function makeChip(root,group,value,label,active=false) { const button=el('button',`chip${active?' active':''}`,label); button.type='button'; button.dataset.group=group; button.dataset.val=value; root.append(button); }
  function populateFilters() {
    makeChip($('task-filters'),'task','all','全部',true); batch.tasks.forEach((task)=>makeChip($('task-filters'),'task',taskIdentity(task),taskDisplay(task)));
    makeChip($('priority-filters'),'priority','all','全部',true); ['P0','P1','P2','P3','P4'].forEach((p)=>makeChip($('priority-filters'),'priority',p,p));
    makeChip($('recovery-filters'),'recovery','all','全部',true); makeChip($('recovery-filters'),'recovery','RECOVERED','已恢复'); makeChip($('recovery-filters'),'recovery','UNRECOVERED','未恢复');
    [...new Set(batch.tasks.map((task)=>task.execution_classification).filter(Boolean))].sort().forEach((value)=>addOption($('classification-filter'),value,classificationLabels[value] || value));
    [...new Set(batch.tasks.flatMap((task)=>(task.error_findings || []).map((item)=>item.category)).filter(Boolean))].sort().forEach((value)=>addOption($('category-filter'),value,categoryLabels[value] || value));
    [...new Set(batch.tasks.flatMap((task)=>(task.proposed_changes || []).map((item)=>item.component)).filter(Boolean))].sort().forEach((value)=>addOption($('component-filter'),value,componentLabels[value] || value));
  }

  function selected(group) { return [...document.querySelectorAll(`.chip[data-group="${group}"].active`)].map((node)=>node.dataset.val); }
  function applyFilter() {
    const query=$('q').value.trim().toLowerCase(); const tasks=selected('task'); const priorities=selected('priority'); const recoveries=selected('recovery');
    const judge=$('judge-filter').value; const classification=$('classification-filter').value; const category=$('category-filter').value; const component=$('component-filter').value;
    let visibleTasks=0,visibleCards=0;
    document.querySelectorAll('.task').forEach((section)=>{
      const taskAllowed=(tasks.includes('all') || tasks.includes(section.dataset.task)) && (!judge || section.dataset.judge===judge) && (!classification || section.dataset.classification===classification);
      let cards=0;
      section.querySelectorAll('.card').forEach((card)=>{
        const priorityOk=priorities.includes('all') || priorities.includes(card.dataset.priority);
        const recoveryOk=recoveries.includes('all') || card.dataset.recoveries.split('|').some((value)=>recoveries.includes(value));
        const categoryOk=!category || card.dataset.categories.split('|').includes(category);
        const componentOk=!component || card.dataset.component===component;
        const queryOk=!query || card.textContent.toLowerCase().includes(query) || section.querySelector('h2').textContent.toLowerCase().includes(query);
        const show=taskAllowed && priorityOk && recoveryOk && categoryOk && componentOk && queryOk; card.classList.toggle('filter-hidden',!show); if(show) cards++;
      });
      const hasFilter=!priorities.includes('all') || !recoveries.includes('all') || category || component || query;
      const showTask=taskAllowed && (!hasFilter || cards>0); section.classList.toggle('section-hidden',!showTask); if(showTask){visibleTasks++;visibleCards+=cards;}
    });
    $('stats').textContent=`显示 ${visibleTasks} / ${batch.tasks.length} 个任务 · ${visibleCards} 张卡片`;
  }

  function bindInteractions() {
    document.querySelectorAll('.chip').forEach((chip)=>chip.addEventListener('click',()=>{
      const group=chip.dataset.group;
      if(chip.dataset.val==='all'){document.querySelectorAll(`.chip[data-group="${group}"]`).forEach((node)=>node.classList.remove('active'));chip.classList.add('active');}
      else if(chip.classList.contains('active')) chip.classList.remove('active');
      else {document.querySelector(`.chip[data-group="${group}"][data-val="all"]`).classList.remove('active');chip.classList.add('active');}
      if(!document.querySelector(`.chip[data-group="${group}"].active`)) document.querySelector(`.chip[data-group="${group}"][data-val="all"]`).classList.add('active');
      applyFilter();
    }));
    $('q').addEventListener('input',applyFilter); document.querySelectorAll('.tb-select').forEach((select)=>select.addEventListener('change',applyFilter));
    document.querySelectorAll('.card-head').forEach((head)=>head.addEventListener('click',()=>{const body=head.parentNode.querySelector('.card-body');const hidden=body.classList.toggle('collapsed');head.setAttribute('aria-expanded',hidden?'false':'true');}));
    const setAll=(collapse)=>{document.querySelectorAll('.card-body').forEach((body)=>body.classList.toggle('collapsed',collapse));document.querySelectorAll('.card-head').forEach((head)=>head.setAttribute('aria-expanded',collapse?'false':'true'));};
    $('expand-all').addEventListener('click',()=>setAll(false)); $('collapse-all').addEventListener('click',()=>setAll(true));
    $('toc-toggle').addEventListener('click',function(){const collapsed=document.body.classList.toggle('toc-collapsed');this.textContent=collapsed?'展开目录':'收起目录';this.setAttribute('aria-expanded',collapsed?'false':'true');});
  }

  function highlightJson() {
    document.querySelectorAll('pre.json').forEach((node)=>{const text=node.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');node.innerHTML=text.replace(/("(?:\\.|[^"\\])*")(\s*:)?|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|\b(true|false|null)\b/g,(match,string,colon)=>{if(string!==undefined)return `<span class="${colon?'j-key':'j-str'}">${string}${colon||''}</span>`;if(match==='true'||match==='false')return `<span class="j-bool">${match}</span>`;if(match==='null')return `<span class="j-null">${match}</span>`;return `<span class="j-num">${match}</span>`;});});
  }

  function init() {
    const date=new Date(batch.generated_at); $('report-meta').textContent=`生成日期：${Number.isNaN(date.getTime())?safe(batch.generated_at):date.toLocaleString('zh-CN')} · 累计 ${batch.batch_runs || 1} 次批跑 · 数据来源：Judge、Trace 与 HALO v9`;
    (batch.archives || []).forEach((archive,index)=>{const a=el('a','',`历史归档 ${index+1}（${archive.task_count} 个任务）`);a.href=archive.file;$('archive-links').append(a);});
    if(batch.is_archive) $('archive-links').append(el('span','','当前为历史归档报告'));
    if((batch.errors || []).length){const box=el('div','batch-errors');box.append(el('strong','',`未生成有效诊断的任务（${batch.errors.length}）`));const ul=el('ul');batch.errors.forEach((message)=>ul.append(el('li','',message)));box.append(ul);$('batch-errors').append(box);}
    batch.tasks.forEach((task,index)=>{$('task-list').append(renderTask(task));$('toc-root').append(renderToc(task,index));});
    populateFilters(); bindInteractions(); highlightJson(); applyFilter();
    $('footer').textContent=`HALO v9 · ${batch.tasks.length} 个任务 · 页面格式由 halo_diagnostic_report.template.html 固定`;
    if('IntersectionObserver' in window){const links={};document.querySelectorAll('#toc a[data-spy]').forEach((a)=>links[a.getAttribute('href').slice(1)]=a);const observer=new IntersectionObserver((entries)=>entries.forEach((entry)=>{if(entry.isIntersecting){Object.values(links).forEach((a)=>a.classList.remove('active'));if(links[entry.target.id])links[entry.target.id].classList.add('active');}}),{rootMargin:'-15% 0px -70% 0px'});document.querySelectorAll('.task,.card').forEach((node)=>observer.observe(node));}
  }
  init();
})();
</script>
