# XiaoYi Loop Skill 本机配置模板。
# 仅在默认设置不适用时，复制为 <Agent 工作目录>/.xiaoyi-loop/local.toml。
# 不要在 Skill 安装目录创建 local.toml。标准入口会把以下运行产物的相对路径解析到
# Agent 工作目录。

version = 1

[paths]
# 可选回退路径。通常由 Agent 从当前工作目录的 task/ 自动发现；只有希望长期固定
# 一个包含 <task_id>/metadata.json 的根目录时才填写。
tasks_root = ""
# 默认分别写入 <工作目录>/xiaoyi_logs、<工作目录>/xiaoyi_judge 和
# <工作目录>/pipeline_state.json。
logs_dir = "xiaoyi_logs"
run_dir = "xiaoyi_judge"
state_file = "pipeline_state.json"

[device]
# 可填写 PATH 中的命令名或 hdc.exe 绝对路径。
hdc = "hdc"
target = ""
user_id = ""
bundle_name = "com.huawei.hmos.vassistant"
ability_name = "PCAgentTaskAbility"
remote_workspace_base = "/data/app/el2/100/base/com.huawei.hmos.vassistant/files/taichu_data"

[runner]
# 内部完成状态检测频率；不会按此频率打印终端输出，等待心跳固定为每 5 分钟一次。
poll_seconds = 3.0
timeout_seconds = 1800
settle_seconds = 1.5
restart_delay_seconds = 5.0
tail_lines = 300
force_stop = true
stop_on_error = false

# Agent Judge 由调用 Skill 的 Codex Agent/Subagent 完成，不需要 API key。
