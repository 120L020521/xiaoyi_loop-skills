        },
        {

          judge: { status: 'failed', score: '0.68', rubrics: [

          findings: [

              { source: 'TRACE', ref: 'c88b1f02…', tool: 'read', fact: '同一路径和参数被重复调用', error: '' }
            ]}
          ],
          changes: [
            { priority: 'P1', component: 'prompt', target: 'runner_skill.md', title: '将负责人加入风险表必填检查', refs: ['ERR1'], implementation: '提交前逐行检查风险、影响、负责人和缓解措施。', criteria: ['每个风险项都包含非空负责人'], impact: '提升报告字段完整性。' },
            { priority: 'P2', component: 'tool_impl', target: 'workspace_bench_tools.ts', title: '复用已读取的文档内容', refs: ['ERR2'], implementation: '对相同路径和未变化指纹复用解析结果。', criteria: ['无文件变化时同一路径只解析一次'], impact: '减少重复调用和上下文消耗。' },
            { priority: 'P0', component: 'middleware_in_tool', target: 'workspace_bench_tools.ts', title: '增加必填字段验证结果', refs: ['ERR1'], implementation: '保存后返回结构化缺失字段列表。', criteria: ['缺失负责人时返回明确错误', '字段齐全时返回 validation=complete'], impact: '提交前阻止不完整报告。' }
          ]
        },
        {
          id: 'task117',
          name: '根据日志生成故障复盘文档',
          judge: { status: 'missing', score: '—', rubrics: [] },
          classification: 'UNKNOWN',
          primary: 'Trace 缺少明确的根执行终止字段，无法确认任务是否正常完成。',
          findings: [
            { id: 'ERR1', category: 'MISSING_TERMINAL_EVIDENCE', title: '缺少根执行终止证据', summary: 'Trace 包含工具活动，但没有可验证的根 Agent 结束事件。', rootCause: '日志采集在会话结束前停止。', impact: '无法可靠区分完成、超时或中断。', evidence: [
              { source: 'TRACE', ref: 'trace-root-117', tool: 'AGENT', fact: '根 Span 没有终止状态', error: '' }
            ]}
          ],
          changes: [
            { priority: 'P1', component: 'middleware_in_tool', target: 'workspace_bench_tools.ts', title: '保证写入根执行终止事件', refs: ['ERR1'], implementation: '在正常、异常和超时出口统一写入根执行终止状态。', criteria: ['每次执行恰好存在一个根终止事件'], impact: '让 HALO 能可靠分类执行结果。' }
          ]
        }
      ];

      const state = {
        task: 'all', judge: 'all', classification: 'all', priority: 'all', category: 'all', component: 'all',
        open: new Set()
      };

      const priorities = ['P0', 'P1', 'P2', 'P3', 'P4'];
      const components = [
        'tool_definition',
        'tool_impl',
        'new_tool',
        'tool_merge',
        'tool_split',
        'middleware_in_tool',
        'prompt'
      ];
      const categoryLabels = {
        ENVIRONMENT_FAILURE: '环境依赖失败',
        DATA_EXTRACTION_ERROR: '数据提取错误',
        OUTPUT_VALIDATION_ERROR: '输出验证错误',
        VERIFICATION_FAILURE: '验证流程失败',
        CONTENT_OMISSION: '内容缺失',
        REDUNDANT_TOOL_USAGE: '工具重复调用',
        MISSING_TERMINAL_EVIDENCE: '缺少终止证据'
      };
      const priorityRank = (priority) => priorities.indexOf(priority);

      const make = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const select = (id) => root.querySelector(`#${id}`);
      const option = (value, label) => {
        const node = document.createElement('option');
        node.value = value;
        node.textContent = label;
        return node;
      };
      const priorityBadge = (priority) => make('span', `halo-priority ${priority.toLowerCase()}`, priority);
      const judgeText = (judge) => judge.status === 'failed' ? `Judge 未通过 · ${judge.score}` : judge.status === 'passed' ? `Judge 通过 · ${judge.score}` : 'Judge 缺失';
      const judgeClass = (judge) => judge.status;
      const taskColorClass = (task) => {
        const index = tasks.findIndex((item) => item.id === task.id);
        return `halo-task-color-${Math.max(index, 0) % 6}`;
      };

      function populateFilters() {
        tasks.forEach((task) => select('halo-filter-task').append(option(task.id, task.id)));
        [...new Set(tasks.flatMap((task) => task.findings.map((finding) => finding.category)))].sort().forEach((value) => select('halo-filter-category').append(option(value, categoryLabels[value] || value)));
        components.forEach((value) => select('halo-filter-component').append(option(value, value)));
      }

      function mergeChanges(changes) {
        const merged = new Map();
        changes.forEach((change) => {
          const key = [change.component, change.target, change.title, change.implementation].join('|');
          if (!merged.has(key)) {
            merged.set(key, {
              ...change,
              refs: [...new Set(change.refs)],
              criteria: [...new Set(change.criteria)]
            });
            return;
          }
          const current = merged.get(key);
          current.refs = [...new Set([...current.refs, ...change.refs])];
          current.criteria = [...new Set([...current.criteria, ...change.criteria])];
          if (priorityRank(change.priority) < priorityRank(current.priority)) current.priority = change.priority;
        });
        return [...merged.values()].sort((a, b) => priorityRank(a.priority) - priorityRank(b.priority));
      }

      function visibleChanges(task) {
        return mergeChanges(task.changes)
          .filter((change) =>
            (state.priority === 'all' || change.priority === state.priority) &&
            (state.component === 'all' || change.component === state.component)
          )
          .sort((a, b) => priorityRank(a.priority) - priorityRank(b.priority));
      }

      function visibleFindings(task, changes) {
        const restrictToChanges = state.priority !== 'all' || state.component !== 'all';
        return task.findings
          .filter((finding) =>
            (state.category === 'all' || finding.category === state.category) &&
            (!restrictToChanges || changes.some((change) => change.refs.includes(finding.id)))
          )
          .sort((a, b) => {
            const rank = (finding) => {
              const related = task.changes.filter((change) => change.refs.includes(finding.id));
              return related.length ? Math.min(...related.map((change) => priorityRank(change.priority))) : priorities.length;
            };
            return rank(a) - rank(b);
          });
      }

      function taskView(task) {
        let changes = visibleChanges(task);
        const findings = visibleFindings(task, changes);
        if (state.category !== 'all') {
          const visibleFindingIds = new Set(findings.map((finding) => finding.id));
          changes = changes.filter((change) => change.refs.some((ref) => visibleFindingIds.has(ref)));
        }
        const baseMatch =
          (state.task === 'all' || task.id === state.task) &&
          (state.judge === 'all' || task.judge.status === state.judge) &&
          (state.classification === 'all' || task.classification === state.classification);
        const priorityMatch = state.priority === 'all' || changes.length > 0;
        const categoryMatch = state.category === 'all' || findings.length > 0;
        const componentMatch = state.component === 'all' || changes.length > 0;
        const detailMatch = priorityMatch && categoryMatch && componentMatch;
        return { task, changes, findings, visible: baseMatch && detailMatch };
      }

      function renderStats(views) {
        const current = views.filter((view) => view.visible);
        select('halo-stat-tasks').textContent = String(current.length);
        select('halo-stat-failed').textContent = String(current.filter((view) => view.task.judge.status === 'failed').length);
        select('halo-stat-findings').textContent = String(current.reduce((sum, view) => sum + view.findings.length, 0));
        select('halo-stat-changes').textContent = String(current.reduce((sum, view) => sum + view.changes.length, 0));
      }

      function renderRubrics(task) {
        const section = make('section', 'halo-section');
        const title = make('div', 'halo-section-title');
        title.append(make('h3', '', 'Judge 未通过项'), make('span', 'halo-muted', task.judge.rubrics.length ? `${task.judge.rubrics.length} 项` : '无 Judge 数据'));
        section.append(title);
        if (!task.judge.rubrics.length) {
          section.append(make('p', 'halo-muted', '该任务没有可用的 Judge Rubric。'));
          return section;
        }
        const list = make('div', 'halo-rubrics');
        task.judge.rubrics.forEach((rubric) => {
          const row = make('div', 'halo-rubric');
          row.append(make('span', 'halo-rubric-mark', rubric.id));
          const body = make('div');
          body.append(make('p', '', rubric.text), make('p', 'halo-muted', rubric.detail));
          row.append(body);
          list.append(row);
        });
        section.append(list);
        return section;
      }

      function renderChange(change, task) {
        const article = make('article', `halo-change ${change.priority.toLowerCase()}`);
        const head = make('div', 'halo-change-head');
        const title = make('div', 'halo-finding-title');
        title.append(priorityBadge(change.priority), make('h3', '', change.title));
        head.append(title, make('span', 'halo-chip', change.component));
        const linkedProblems = change.refs.map((ref) => {
          const finding = task.findings.find((item) => item.id === ref);
          return finding ? `${ref} ${finding.title}` : ref;
        });
        article.append(head, make('p', 'halo-change-meta', `${change.target} · 关联问题：${linkedProblems.join('；')}`));
        article.append(make('p', '', `实施：${change.implementation}`));
        const list = make('ul');
        change.criteria.forEach((criterion) => list.append(make('li', '', criterion)));
        article.append(list, make('p', '', `预期收益：${change.impact}`));
        return article;
      }

      function renderFinding(finding) {
        const article = make('article', 'halo-finding');
        const head = make('div', 'halo-finding-head');
        const title = make('div', 'halo-finding-title');
        title.append(make('h3', '', `${finding.id} · ${finding.title}`));
        head.append(title, make('span', 'halo-chip', categoryLabels[finding.category] || finding.category));
        article.append(head, make('p', '', finding.summary));

        const grid = make('div', 'halo-finding-grid');
        const rootCause = make('div', 'halo-field');
        rootCause.append(make('span', 'halo-field-label', 'Root Cause'), make('span', '', finding.rootCause));
        const impact = make('div', 'halo-field');
        impact.append(make('span', 'halo-field-label', 'Impact'), make('span', '', finding.impact));
        grid.append(rootCause, impact);
        article.append(grid);

        const evidenceDetails = make('details', 'halo-evidence-toggle');
        evidenceDetails.append(make('summary', '', `查看 Trace / Judge 证据（${finding.evidence.length}）`));
        const evidenceList = make('div', 'halo-evidence-list');
        finding.evidence.forEach((evidence) => {
          const item = make('div', 'halo-evidence');
          const evidenceHead = make('div', 'halo-evidence-head');
          evidenceHead.append(make('span', 'halo-chip', evidence.source), make('code', '', evidence.ref));
          item.append(evidenceHead, make('p', '', evidence.fact), make('p', 'halo-muted', `${evidence.tool}${evidence.error ? ` · ${evidence.error}` : ''}`));
          evidenceList.append(item);
        });
        evidenceDetails.append(evidenceList);
        article.append(evidenceDetails);

        return article;
      }

      function renderTask(view) {
        const { task, findings, changes } = view;
        const article = make('article', `halo-task ${taskColorClass(task)}${state.open.has(task.id) ? ' is-open' : ''}`);
        article.id = `halo-${task.id}`;
        const toggle = make('button', 'halo-task-toggle');
        toggle.type = 'button';
        toggle.setAttribute('aria-expanded', String(state.open.has(task.id)));

        const main = make('div', 'halo-task-main');
        main.append(make('span', 'halo-task-id', task.id), make('span', 'halo-task-name', task.name));
        const meta = make('div', 'halo-task-meta');
        meta.append(make('span', `halo-chip ${judgeClass(task.judge)}`, judgeText(task.judge)));
        meta.append(make('span', 'halo-chip', `${findings.length} 个问题`));
        meta.append(make('span', 'halo-chip', `${changes.length} 条建议`));
        meta.append(make('span', 'halo-chevron', '›'));
        toggle.append(main, meta);
        toggle.addEventListener('click', () => {
          if (state.open.has(task.id)) state.open.delete(task.id); else state.open.add(task.id);
          render();
        });
        article.append(toggle);

        const detail = make('div', 'halo-task-detail');
        const primary = make('div', 'halo-primary');
        primary.append(make('span', 'halo-field-label', task.classification), make('p', '', task.primary));
        detail.append(primary, renderRubrics(task));

        const section = make('section', 'halo-section');
        const grid = make('div', 'halo-diagnosis-grid');

        const problemColumn = make('div', 'halo-diagnosis-column');
        const problemHeading = make('div', 'halo-column-heading');
        problemHeading.append(make('h3', '', '问题与证据'), make('span', 'halo-muted', `${findings.length} 个问题`));
        const problemList = make('div', 'halo-problem-list');
        if (findings.length) findings.forEach((finding) => problemList.append(renderFinding(finding)));
        else problemList.append(make('p', 'halo-muted', '当前筛选条件下没有匹配的问题。'));
        problemColumn.append(problemHeading, problemList);

        const suggestionColumn = make('div', 'halo-diagnosis-column');
        const suggestionHeading = make('div', 'halo-column-heading');
        suggestionHeading.append(make('h3', '', '合并后的改进建议'), make('span', 'halo-muted', `${changes.length} 条建议`));
        const suggestionList = make('div', 'halo-suggestion-list');
        if (changes.length) changes.forEach((change) => suggestionList.append(renderChange(change, task)));
        else suggestionList.append(make('p', 'halo-muted', '当前筛选条件下没有匹配的建议。'));
        suggestionColumn.append(suggestionHeading, suggestionList);

        grid.append(problemColumn, suggestionColumn);
        section.append(grid);
        detail.append(section);
        article.append(detail);
        return article;
      }

      function render() {
        const views = tasks.map(taskView);
        renderStats(views);
        const container = select('halo-task-list');
        const navigation = select('halo-task-nav-list');
        container.replaceChildren();
        navigation.replaceChildren();
        const visible = views.filter((view) => view.visible);
        if (!visible.length) {
          container.append(make('div', 'halo-empty', '没有符合当前筛选条件的任务。'));
          return;
        }
        visible.forEach((view) => {
          container.append(renderTask(view));
          const item = make('a', 'halo-nav-link', view.task.id);
          item.href = `#halo-${view.task.id}`;
          navigation.append(item);
        });
      }

      const bindings = [
        ['halo-filter-task', 'task'],
        ['halo-filter-judge', 'judge'],
        ['halo-filter-classification', 'classification'],
        ['halo-filter-priority', 'priority'],
        ['halo-filter-category', 'category'],
        ['halo-filter-component', 'component']
      ];
      bindings.forEach(([id, key]) => select(id).addEventListener('change', (event) => {
        state[key] = event.target.value;
        render();
      }));

      const filterDock = root.querySelector('.halo-filter-dock');
      const filterToggle = select('halo-filter-toggle');
      const setFiltersCollapsed = (collapsed) => {
        filterDock.classList.toggle('is-collapsed', collapsed);
        filterToggle.setAttribute('aria-expanded', String(!collapsed));
        filterToggle.textContent = collapsed ? '展开筛选' : '收起筛选';
      };
      setFiltersCollapsed(window.matchMedia('(max-width: 620px)').matches);
      filterToggle.addEventListener('click', () => {
        setFiltersCollapsed(filterToggle.getAttribute('aria-expanded') === 'true');
      });

      populateFilters();
      render();
    })();
  </script>
</div>
